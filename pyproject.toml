[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "tinyEmber"
version = "1.9.3"
description = "A lightweight CLI tool"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "chen kumar" }]
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.scripts]
tinyEmber = "tinyEmber.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]